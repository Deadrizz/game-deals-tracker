[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
  \.venv
| venv
| migrations
| __pycache__
| \.git
| \.mypy_cache
| \.pytest_cache
| \.ruff_cache
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  ".venv",
  "venv",
  "__pycache__",
  "migrations",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
